name: Deploy web build to GitHub Pages

on:
  push:
    branches: [claude/incremental-game-mobile-saoj09]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      # Publishes dist/ to the gh-pages branch, which GitHub Pages serves
      # automatically. Adds .nojekyll so the _expo asset dir isn't dropped.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
